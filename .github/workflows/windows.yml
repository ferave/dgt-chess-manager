name: Windows executable

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r requirements-hardware.txt pyinstaller
      - run: pyinstaller --clean --noconfirm --onefile --name dgt_server --paths scripts --distpath release scripts/dgt_server.py
      - run: npm ci
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: DGT-Chess-Manager-Windows
          path: release/*.exe
